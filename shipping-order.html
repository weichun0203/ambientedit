<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2F079YMSFW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-2F079YMSFW');
    </script>

    <meta charset="UTF-8">
    <!-- 加入 maximum-scale=1.0 與 user-scalable=no 徹底鎖定手機版縮放與滑動 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>常溫訂購單小幫手｜Ambient Order Helper</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            paper: '#fdfbf7',
                            ink: '#4a4a4a',
                            sage: '#8da399',
                            clay: '#d4a59a',
                            sand: '#e6e2dd',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    },
                    boxShadow: {
                        soft: '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        /* 徹底鎖定畫面，防止手機下拉回彈或滾動 */
        html, body {
            overflow: hidden;
            touch-action: manipulation;
            background-color: #fdfbf7;
            color: #4a4a4a;
            height: 100%;
        }
        .bg-noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            background-attachment: fixed;
        }
        /* 隱藏卷軸 (以防萬一) */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-noise font-sans selection:bg-brand-sage selection:text-white">

    <!-- 使用 100dvh 適應手機瀏覽器高度，限制最大寬度讓電腦版也好看 -->
    <main class="flex flex-col h-[100dvh] max-w-md mx-auto p-3 relative">
        
        <!-- Header -->
        <header class="flex justify-between items-end shrink-0 mb-3 border-b border-brand-sand pb-2">
            <div>
                <div class="text-brand-sage font-serif tracking-widest text-[10px] mb-1 opacity-80">
                    常溫編集所 Ambient Edit
                </div>
                <h1 class="text-xl font-bold font-serif text-brand-ink flex items-center gap-2">
                    訂購單小幫手
                </h1>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- 重置按鈕 -->
                <button onclick="resetOrder()" class="p-2 rounded-full border border-brand-sand bg-white/70 text-brand-clay hover:bg-brand-clay hover:text-white transition-all shadow-sm active:scale-95" aria-label="重置訂單">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="reset-icon"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
                <!-- 返回首頁 -->
                <a href="https://weichun0203.github.io/ambientedit/" class="p-2 rounded-full border border-brand-sand bg-white/70 text-brand-sage hover:bg-brand-sage hover:text-white transition-all shadow-sm active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </a>
            </div>
        </header>

        <!-- 商品選擇區 (緊湊網格) -->
        <section class="shrink-0 bg-white/80 p-3 rounded-2xl shadow-soft border border-brand-sand mb-3">
            <div class="flex justify-between items-end mb-2">
                <h2 class="text-sm font-bold text-brand-ink flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-clay"><path d="M12 2v20"/><path d="m4.93 10.93 14.14-14.14"/><path d="m2 22 14.14-14.14"/><path d="m13.07 19.07 5.05-5.05"/></svg>
                    點擊選擇商品
                </h2>
                <span class="text-[10px] text-brand-ink/50">直接點擊卡片增加數量</span>
            </div>
            <!-- 商品網格：3欄排列，間距緊湊 -->
            <div id="items-grid" class="grid grid-cols-3 gap-1.5">
                <!-- JS 動態生成 -->
            </div>
        </section>

        <!-- 運送方式區塊 -->
        <section class="shrink-0 bg-white/80 p-3 rounded-2xl shadow-soft border border-brand-sand mb-3">
            <div class="flex gap-2">
                <label class="delivery-label flex-1 flex items-center justify-center p-2 rounded-xl cursor-pointer transition-all duration-300 border">
                    <input type="radio" name="delivery" value="711" class="hidden">
                    <span class="text-xs font-medium text-brand-ink text-center">
                        7-11 寄送<br><span class="text-[10px] opacity-60">Shipping (+$38)</span>
                    </span>
                </label>
                <label class="delivery-label flex-1 flex items-center justify-center p-2 rounded-xl cursor-pointer transition-all duration-300 border">
                    <input type="radio" name="delivery" value="in-person" class="hidden">
                    <span class="text-xs font-medium text-brand-ink text-center">
                        面交<br><span class="text-[10px] opacity-60">In-person (免運)</span>
                    </span>
                </label>
            </div>
            
            <!-- 面交地點輸入 -->
            <div id="in-person-details" class="hidden mt-2 transition-all duration-300">
                <div class="flex gap-2">
                    <button type="button" onclick="setMeetupLocation('金華街 Jin Hua Chapel')" class="px-2 py-1.5 text-[10px] bg-brand-paper text-brand-ink border border-brand-sand rounded-lg hover:border-brand-sage hover:text-brand-sage active:scale-95 transition-all whitespace-nowrap">
                        📍 金華街
                    </button>
                    <input type="text" id="meetup-location" placeholder="輸入面交地點..." class="w-full p-1.5 bg-white border border-brand-sand rounded-lg focus:ring-1 focus:ring-brand-sage focus:border-brand-sage outline-none text-xs transition-all text-brand-ink">
                </div>
            </div>
        </section>

        <!-- 預覽與結帳 (填滿剩餘高度) -->
        <section class="flex flex-col flex-1 bg-white/90 p-4 rounded-2xl shadow-soft border border-brand-sand justify-between overflow-hidden">
            <!-- 預覽文字區，若過長內部可微小滾動 -->
            <div id="order-preview" class="bg-brand-paper rounded-xl p-3 font-mono text-[11px] text-brand-ink whitespace-pre-wrap flex-1 border border-brand-sand leading-relaxed overflow-y-auto mb-3">
                尚未選擇商品
            </div>

            <div class="shrink-0 border-t border-brand-sand pt-3">
                <div class="flex justify-between items-end mb-3">
                    <span class="text-brand-ink/70 font-medium text-xs">總計金額 Total</span>
                    <span class="text-2xl font-bold font-serif text-brand-clay leading-none" id="total-price">$0</span>
                </div>
                
                <button id="copy-btn" onclick="copyToClipboard()" disabled
                    class="w-full py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-bold text-sm tracking-widest transition-all duration-300 bg-brand-sand/50 text-brand-ink/40 cursor-not-allowed">
                    <svg id="copy-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span id="copy-text">一鍵複製訂單</span>
                </button>
            </div>
        </section>
    </main>

    <!-- Application Logic -->
    <script>
        const SHIPPING_PRICE = 38;
        
        // 統一管理所有商品資料
        const itemsData = [
            // 領帶 Ties ($350)
            { id: 'tie_red', name: '紅 Red', shortName: '紅 Red', type: 'tie', price: 350 },
            { id: 'tie_purple', name: '紫 Purple', shortName: '紫 Purple', type: 'tie', price: 350 },
            { id: 'tie_pink', name: '粉 Pink', shortName: '粉 Pink', type: 'tie', price: 350 },
            { id: 'tie_yellow', name: '黃 Yellow', shortName: '黃 Yellow', type: 'tie', price: 350 },
            { id: 'tie_lightblue', name: '淺藍 Light Blue', shortName: '淺藍 Light Blue', type: 'tie', price: 350 },
            { id: 'tie_navy', name: '深藍 Navy Blue', shortName: '深藍 Navy Blue', type: 'tie', price: 350 },
            { id: 'tie_grey', name: '灰 Grey', shortName: '灰 Grey', type: 'tie', price: 350 },
            { id: 'tie_white', name: '白 White', shortName: '白 White', type: 'tie', price: 350 },
            { id: 'tie_black', name: '黑 Black', shortName: '黑 Black', type: 'tie', price: 350 },
            // 其他 Others
            { id: 'scroll', name: '卷軸 Scrolls', shortName: '📜 卷軸', type: 'other', price: 650 },
            { id: 'embroidery', name: '電繡 TempleEmbroidery', shortName: '🧵 電繡', type: 'other', price: 800 },
            { id: 'card_taipei', name: '卡套(台北聖殿) Card Holder', shortName: '🪪 卡套(台北)', type: 'other', price: 150 },
            { id: 'card_kaohsiung', name: '卡套(高雄聖殿) Card Holder', shortName: '🪪 卡套(高雄)', type: 'other', price: 150 }
        ];

        // 狀態管理
        let state = {
            items: {}, // 存放每個 id 的數量
            delivery: '711',
            location: ''
        };

        // 初始化所有商品數量為 0
        itemsData.forEach(item => state.items[item.id] = 0);

        const STORAGE_KEY = 'ambient_order_state_v2';
        
        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.delivery = parsed.delivery || '711';
                    state.location = parsed.location || '';
                    if (parsed.items) {
                        itemsData.forEach(item => {
                            state.items[item.id] = parsed.items[item.id] || 0;
                        });
                    }
                }
            } catch (e) {
                console.error("Local storage load error", e);
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // 重置訂單
        function resetOrder() {
            // 圖示旋轉動畫
            const icon = document.getElementById('reset-icon');
            icon.style.transition = 'transform 0.5s ease';
            icon.style.transform = 'rotate(-360deg)';
            
            // 歸零
            itemsData.forEach(item => state.items[item.id] = 0);
            state.delivery = '711';
            state.location = '';
            
            saveState();
            updateUI();

            // 動畫復原
            setTimeout(() => {
                icon.style.transition = 'none';
                icon.style.transform = 'rotate(0deg)';
            }, 500);
        }

        // 更新單一商品數量 (+1 或 -1)
        function updateItem(id, delta) {
            let newVal = (state.items[id] || 0) + delta;
            if (newVal < 0) newVal = 0;
            state.items[id] = newVal;
            saveState();
            updateUI();
        }

        function setMeetupLocation(loc) {
            state.location = loc;
            document.getElementById('meetup-location').value = loc;
            saveState();
            updateUI();
        }

        // 綁定事件
        document.querySelectorAll('input[name="delivery"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                state.delivery = e.target.value;
                saveState();
                updateUI();
            });
        });

        document.getElementById('meetup-location').addEventListener('input', (e) => {
            state.location = e.target.value;
            saveState();
            updateUI();
        });

        // 渲染商品網格 UI (點擊卡片+1，出現減號可-1)
        function renderItemsGrid() {
            const container = document.getElementById('items-grid');
            container.innerHTML = '';
            
            itemsData.forEach(item => {
                const count = state.items[item.id];
                const isActive = count > 0;
                
                const div = document.createElement('div');
                div.className = `relative flex flex-col items-center justify-center p-1 rounded-xl h-[42px] cursor-pointer transition-all duration-200 select-none ${isActive ? 'bg-brand-sage text-white shadow-soft' : 'bg-brand-paper/50 border border-brand-sand text-brand-ink hover:bg-brand-sand/50'}`;
                
                // 點擊卡片任何地方 = +1
                div.onclick = () => updateItem(item.id, 1);

                // 如果有數量，右上角顯示小減號 (StopPropagation 避免觸發 +1)
                let minusBtn = '';
                if (isActive) {
                    minusBtn = `<button onclick="event.stopPropagation(); updateItem('${item.id}', -1)" class="absolute -top-1.5 -right-1.5 w-[22px] h-[22px] flex items-center justify-center bg-[#d4a59a] border-2 border-white text-white rounded-full text-sm font-bold shadow-sm hover:scale-110 active:scale-95 transition-transform z-10">&minus;</button>`;
                }

                div.innerHTML = `
                    ${minusBtn}
                    <span class="text-[11px] font-medium leading-tight text-center tracking-tight truncate w-full px-1">${item.shortName}</span>
                    ${isActive ? `<span class="text-[10px] font-bold mt-0.5 bg-white/20 px-2 rounded-full leading-none py-0.5">${count}</span>` : ''}
                `;
                container.appendChild(div);
            });
        }

        // 主畫面更新邏輯
        let currentOrderText = '';

        function updateUI() {
            // 1. 渲染網格
            renderItemsGrid();
            document.getElementById('meetup-location').value = state.location;

            // 2. 更新運送 UI
            document.querySelectorAll('input[name="delivery"]').forEach(radio => {
                const label = radio.closest('label');
                if (radio.value === state.delivery) {
                    radio.checked = true;
                    label.classList.add('bg-brand-paper', 'border-brand-sage/50', 'ring-1', 'ring-brand-sage/30');
                    label.classList.remove('border-brand-sand', 'bg-white');
                } else {
                    label.classList.remove('bg-brand-paper', 'border-brand-sage/50', 'ring-1', 'ring-brand-sage/30');
                    label.classList.add('border-brand-sand', 'bg-white');
                }
            });

            const inPersonDetails = document.getElementById('in-person-details');
            if (state.delivery === 'in-person') {
                inPersonDetails.classList.remove('hidden');
            } else {
                inPersonDetails.classList.add('hidden');
            }

            // 3. 計算文字與金額
            let total = 0;
            const activeTies = [];
            const activeOthers = [];
            let hasAnyItem = false;
            
            itemsData.forEach(item => {
                const count = state.items[item.id];
                if (count > 0) {
                    hasAnyItem = true;
                    total += count * item.price;
                    if (item.type === 'tie') {
                        activeTies.push(`${item.name}*${count}`);
                    } else {
                        activeOthers.push(`${item.name}*${count}`);
                    }
                }
            });

            const shippingCost = state.delivery === '711' ? SHIPPING_PRICE : 0;
            total += shippingCost;
            
            document.getElementById('total-price').innerText = `$${total}`;

            const parts = [];
            if (activeTies.length > 0) parts.push(`【領帶 Ties】\n${activeTies.join(', ')}`);
            if (activeOthers.length > 0) parts.push(`【其他 Others】\n${activeOthers.join('\n')}`);
            
            if (state.delivery === '711') {
                parts.push(`【運送 Delivery】7-11 (+${SHIPPING_PRICE})`);
            } else {
                parts.push(`【運送 Delivery】面交 In-person`);
                if (state.location.trim()) {
                    parts.push(`【地點 Location】${state.location.trim()}`);
                }
            }
            
            parts.push(`------------------\n【總計 Total】$${total}`);

            const previewEl = document.getElementById('order-preview');
            const copyBtn = document.getElementById('copy-btn');

            if (!hasAnyItem) {
                currentOrderText = '尚未選擇商品';
                previewEl.innerText = currentOrderText;
                previewEl.classList.add('text-brand-ink/50', 'justify-center', 'items-center');
                
                copyBtn.disabled = true;
                copyBtn.className = "w-full py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-bold text-sm tracking-widest transition-all duration-300 bg-brand-sand/50 text-brand-ink/40 cursor-not-allowed";
            } else {
                currentOrderText = parts.join('\n\n'); // 增加換行讓閱讀更舒服
                previewEl.innerText = currentOrderText;
                previewEl.classList.remove('text-brand-ink/50', 'justify-center', 'items-center');
                
                copyBtn.disabled = false;
                copyBtn.className = "w-full py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-bold text-sm tracking-widest transition-all duration-300 bg-brand-sage text-white hover:bg-brand-ink hover:shadow-soft active:scale-[0.98] cursor-pointer";
            }
        }

        // 複製功能
        function copyToClipboard() {
            if (currentOrderText === '尚未選擇商品') return;
            const textArea = document.createElement("textarea");
            textArea.value = currentOrderText;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                const copyBtn = document.getElementById('copy-btn');
                const copyText = document.getElementById('copy-text');
                const copyIcon = document.getElementById('copy-icon');
                
                copyBtn.className = "w-full py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-bold text-sm tracking-widest transition-all duration-300 bg-brand-clay text-white shadow-soft";
                copyText.innerText = "已複製到剪貼簿！";
                copyIcon.innerHTML = `<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>`;

                setTimeout(() => {
                    updateUI(); 
                    copyText.innerText = "一鍵複製訂單";
                    copyIcon.innerHTML = `<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>`;
                }, 2000);
            } catch (err) {
                console.error('複製失敗', err);
            } finally {
                document.body.removeChild(textArea);
            }
        }

        // 頁面載入初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            updateUI();
        });
    </script>
</body>
</html>
